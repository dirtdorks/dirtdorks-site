<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Stats · Dirt Dorks Trail Club</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: #0a1a0f;
      overflow-x: hidden;
    }

    #map {
      position: fixed;
      inset: 0;
      z-index: 0;
      filter: saturate(1.1) brightness(0.88);
    }

    #vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(ellipse at center, transparent 20%, rgba(10,26,15,0.75) 100%),
        linear-gradient(to bottom, rgba(10,26,15,0.5) 0%, transparent 20%, transparent 80%, rgba(10,26,15,0.8) 100%);
      pointer-events: none;
    }

    .leaflet-control-attribution {
      background: rgba(0,0,0,0.5) !important;
      color: #bbb !important;
      font-size: 10px !important;
    }

    /* ── Page ── */
    #page {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      padding: 2rem 1.2rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .back {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #b6f2c2;
      margin-bottom: 2rem;
      padding: 0.38rem 0.85rem;
      background: rgba(15,40,20,0.75);
      border: 1px solid rgba(182,242,194,0.2);
      border-radius: 20px;
      backdrop-filter: blur(6px);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .back:hover { transform: translateY(-2px); filter: brightness(1.2); }

    /* ── Header ── */
    .page-header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeUp 0.8s cubic-bezier(.16,1,.3,1) both;
    }

    .page-logo {
      width: clamp(80px, 10vw, 110px);
      height: auto;
      display: block;
      margin: 0 auto 0.8rem;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.65));
    }

    .page-header h1 {
      font-family: 'Montserrat Alternates', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      color: #e8f5e2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-shadow: 0 2px 20px rgba(0,0,0,0.6);
      line-height: 1.1;
    }

    .page-header .sub {
      font-size: 0.78rem;
      color: rgba(200,240,210,0.6);
      margin-top: 0.5rem;
      font-style: italic;
    }

    .header-rule {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #4cdc80, transparent);
      margin: 0.8rem auto 0;
    }

    /* ── Widget container ── */
    .widget-wrap {
      animation: fadeUp 0.9s cubic-bezier(.16,1,.3,1) 0.1s both;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      width: 100%;
      max-width: 420px;
    }

    .widget-label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(182,242,194,0.45);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
    }
    .widget-label::before,
    .widget-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(76,220,128,0.2));
    }
    .widget-label::after { transform: scaleX(-1); }

    /* Wood-grain frame around the Strava widget */
    .widget-frame {
      background-color: #1a3524;
      background-image:
        repeating-linear-gradient(90deg,
          rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px,
          transparent 1px, transparent 4px),
        linear-gradient(to bottom, #22422e, #1a3524);
      border: 2px solid #13261b;
      border-radius: 8px;
      padding: 1.2rem;
      box-shadow:
        0 4px 0 #0d1f16,
        0 16px 48px rgba(0,0,0,0.55),
        inset 0 0 14px rgba(24,64,38,0.7);
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* Shimmer top edge */
    .widget-frame::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(76,220,128,0.3), transparent);
      border-radius: 8px 8px 0 0;
    }

    /* Make the Strava iframe fill the frame nicely */
    .widget-frame iframe {
      border-radius: 4px;
      display: block;
      /* Override Strava's fixed width to be responsive */
      width: 100% !important;
      max-width: 340px;
    }

    /* Join CTA */
    .join-cta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.5rem;
    }

    .join-label {
      font-size: 0.68rem;
      color: rgba(182,242,194,0.45);
      font-style: italic;
      text-align: center;
    }

    .join-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      text-decoration: none;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(215,62,0,0.88);
      padding: 0.5rem 1.1rem;
      border-radius: 20px;
      transition: filter 0.15s ease, transform 0.15s ease;
    }
    .join-btn:hover { filter: brightness(1.15); transform: translateY(-2px); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <div id="vignette"></div>

  <div id="page">

    <a class="back" href="index.html">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back to Home
    </a>

    <div class="page-header">
      <img src="logo.png" alt="Dirt Dorks Trail Club" class="page-logo" />
      <h1>Club Stats</h1>
      <p class="sub">This week on the trails.</p>
      <div class="header-rule"></div>
    </div>

    <div class="widget-wrap">
      <div class="widget-label">Weekly Summary</div>

      <div class="widget-frame">
        <iframe
          allowtransparency='true'
          frameborder='0'
          height='160'
          scrolling='no'
          src='https://www.strava.com/clubs/1280609/latest-rides/ea964d0b1f8ab899f1d70d6ec6fed92e596e5836?show_rides=false'
          width='300'>
        </iframe>
      </div>

      <div class="join-cta">
        <p class="join-label">Want your miles counted? Join the club on Strava.</p>
        <a class="join-btn" href="https://www.strava.com/clubs/DirtDorksTC" target="_blank" rel="noopener noreferrer">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0 3 13.828h4.17"/>
          </svg>
          Join on Strava
        </a>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', {
      zoomControl: false, minZoom: 13, maxZoom: 13,
      scrollWheelZoom: false, dragging: false,
      keyboard: false, touchZoom: false, doubleClickZoom: false,
    }).setView([45.5725, -122.7726], 13);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}', {
      attribution: '© <a href="https://www.esri.com">Esri</a>, USGS',
      maxZoom: 13,
      opacity: 0.65,
    }).addTo(map);

    L.rectangle(
      L.latLngBounds([44.0, -124.5], [46.5, -121.0]),
      { color: 'transparent', fillColor: '#0a1a0f', fillOpacity: 0.65, interactive: false }
    ).addTo(map);
  </script>
</body>
</html>
