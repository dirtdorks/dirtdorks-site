<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact · Dirt Dorks Trail Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: #0a1a0f;
      overflow-x: hidden;
    }

    /* ── Static backdrop, no map ── */
    #backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse at center, #14301c 0%, #0a1a0f 70%);
    }
    #vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(ellipse at center, transparent 20%, rgba(10,26,15,0.75) 100%),
        linear-gradient(to bottom, rgba(10,26,15,0.5) 0%, transparent 20%, transparent 80%, rgba(10,26,15,0.8) 100%);
      pointer-events: none;
    }

    /* ── Page layout ── */
    #page {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      padding: 2rem 1.2rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .back {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #b6f2c2;
      margin-bottom: 2rem;
      padding: 0.38rem 0.85rem;
      background: rgba(15,40,20,0.75);
      border: 1px solid rgba(182,242,194,0.2);
      border-radius: 20px;
      backdrop-filter: blur(6px);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .back:hover { transform: translateY(-2px); filter: brightness(1.2); }

    .page-header {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeUp 0.8s cubic-bezier(.16,1,.3,1) both;
    }
    .page-header .eyebrow {
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(182,242,194,0.55);
      margin-bottom: 0.5rem;
    }
    .page-header h1 {
      font-family: 'Montserrat Alternates', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      color: #e8f5e2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-shadow: 0 2px 20px rgba(0,0,0,0.6);
      line-height: 1.1;
    }
    .page-header .sub {
      font-size: 0.78rem;
      color: rgba(200,240,210,0.5);
      margin-top: 0.5rem;
      font-style: italic;
    }
    .header-rule {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #4cdc80, transparent);
      margin: 0.8rem auto 0;
    }

    /* ── Contact content ── */
    .contact-section {
      position: relative;
      width: 100%;
      max-width: 640px;
      overflow: visible;
    }
    .contact-wrap {
      position: relative;
      z-index: 2;
      text-align: center;
    }
    .hero-goat {
      max-width: 240px;
      width: 100%;
      margin: 0 auto 1.5rem;
      display: block;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.6));
    }
    .contact-wrap p {
      color: rgba(200,240,210,0.75);
      font-size: 0.95rem;
      line-height: 1.6;
      max-width: 440px;
      margin: 0 auto;
    }
    .email-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1.8rem;
      flex-wrap: wrap;
    }
    .email-link {
      font-size: 1.2rem;
      font-weight: 600;
      color: #4cdc80;
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .email-link:hover { color: #6ef2a0; }
    .copy-btn {
      background: rgba(15,40,20,0.75);
      border: 1px solid rgba(182,242,194,0.2);
      color: #b6f2c2;
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: 'DM Sans', sans-serif;
      backdrop-filter: blur(6px);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .copy-btn:hover { transform: translateY(-2px); filter: brightness(1.2); }
    .copy-note {
      font-size: 0.75rem;
      color: #4cdc80;
      margin-top: 0.6rem;
      height: 1.1rem;
      letter-spacing: 0.04em;
    }

    .scatter-goat {
      position: absolute;
      z-index: 1;
      opacity: 0.92;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.55));
    }
    .goat-2 { width: 130px; top: -1.5rem; right: -2rem; transform: rotate(-4deg); }
    .goat-3 { width: 110px; bottom: -1rem; right: 4%; transform: rotate(3deg); }
    .goat-4 { width: 210px; top: 35%; left: -4.5rem; }

    @media (max-width: 640px) {
      .scatter-goat { display: none; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div id="backdrop"></div>
  <div id="vignette"></div>

  <div id="page">

    <a class="back" href="index.html">&larr; Back</a>

    <div class="page-header">
      <div class="eyebrow">Dirt Dorks Trail Club</div>
      <h1>Get in Touch</h1>
      <div class="sub">Send a Goat Call</div>
      <div class="header-rule"></div>
    </div>

    <div class="contact-section">
      <img class="scatter-goat goat-4" src="images/goat4.png" alt="">
      <img class="scatter-goat goat-2" src="images/goat2.png" alt="">
      <img class="scatter-goat goat-3" src="images/goat3.png" alt="">

      <div class="contact-wrap">
        <img class="hero-goat" src="images/goat1.png" alt="Dirt Dorks goat mascot">

        <p>Have a partnership idea, a question about a race, or just want to say hi? Drop us a line — we'd love to hear from you.</p>

        <div class="email-row">
          <a class="email-link" href="mailto:run@dirtdorks.com">run@dirtdorks.com</a>
          <button class="copy-btn" onclick="copyEmail()">Copy address</button>
        </div>
        <div class="copy-note" id="copyNote"></div>
      </div>
    </div>

  </div>

  <script>
    function copyEmail() {
      navigator.clipboard.writeText('run@dirtdorks.com').then(function() {
        var note = document.getElementById('copyNote');
        note.textContent = 'Copied!';
        setTimeout(function() { note.textContent = ''; }, 2000);
      });
    }
  </script>

</body>
</html>
