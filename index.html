<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dirt Dorks Trail Club</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Your Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- Logo -->
  <div id="intro">
    <img src="logo.png" alt="Dirt Dorks Trail Club Logo" />
  </div>

  <div id="map"></div>

  <!-- Trail Sign -->
  <div class="trail-sign">
<div class="sign-title">Welcome To The Club</div>

<div class="sign-links">
<a
href="https://instagram.com/dirtdorks"
target="_blank"
class="sign-link"
>
Instagram
</a>

<a
href="https://www.strava.com/clubs/dirtdorks"
target="_blank"
  rel="noopener noreferrer"
class="sign-link"
>
Strava
</a>
</div>
</div>

  <div class="social-overlay">

  <footer></footer>

</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-gpx/gpx.js"></script>
  <script src="script.js"></script>

</html>
