<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dirt Dorks Trail Club</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Your Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- Logo -->
  <div id="intro">
    <img src="logo.png" alt="Dirt Dorks Trail Club Logo" />
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Trail Sign -->
  <div class="trail-sign">
    <div class="sign-title">Welcome To The Club</div>
    <div class="sign-subtitle">Forest Park • Portland, OR</div>
  </div>

  <footer class="site-footer">

  <!-- Instagram Button -->
  <a href="https://instagram.com/dirtdorks"
     target="_blank"
     class="social-btn instagram-btn">

    <!-- Official Instagram Glyph -->
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
      <path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm8.5 2h-8.5A3.75 3.75 0 0 0 4 7.75v8.5A3.75 3.75 0 0 0 7.75 20h8.5A3.75 3.75 0 0 0 20 16.25v-8.5A3.75 3.75 0 0 0 16.25 4z"/>
      <path d="M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
      <circle cx="17.25" cy="6.75" r="1.25"/>
    </svg>

    @dirtdorks
  </a>

  <!-- Strava Button -->
  <a href="https://www.strava.com/clubs/DirtDorksTC"
     target="_blank"
     class="social-btn strava-btn">

    <!-- Official Strava Mark -->
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
      <path d="M12 2l5.5 11H13l-1-2-1 2H6.5L12 2z"/>
      <path d="M12 14l2.5 5h-5L12 14z"/>
    </svg>

    Dirt Dorks TC on Strava
  </a>

</footer>

  <!-- Leaflet Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-gpx/gpx.js"></script>
  <script src="script.js"></script>

</body>
</html>
