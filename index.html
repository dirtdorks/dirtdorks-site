<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico?v=2">
  <meta charset="UTF-8" />
  <title>Dirt Dorks Trail Club</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Logo -->
  <div id="intro">
    <img src="logo.png" alt="Dirt Dorks Trail Club Logo" />
  </div>
  <!-- Map -->
  <div id="map"></div>
  <!-- Trail Sign -->
  <div class="trail-sign">
    <div class="sign-title">Welcome To The Club</div>
    <div class="sign-subtitle">Forest Park • Portland, OR</div>
    <div class="sign-links">
      <a
        href="https://instagram.com/dirtdorks"
        target="_blank"
        rel="noopener noreferrer"
        class="sign-link"
      >
        Instagram
      </a>
      <a
        href="https://www.strava.com/clubs/DirtDorksTC"
        target="_blank"
        rel="noopener noreferrer"
        class="sign-link"
      >
        Strava
      </a>
      <div class="sign-dropdown-wrap">
        <button class="sign-link sign-link-explore" id="explore-btn" aria-haspopup="true" aria-expanded="false">
          Explore ▾
        </button>
        <div class="sign-dropdown" id="explore-menu" role="menu">
          <div class="sign-dropdown-inner">
            <a href="events.html" class="dropdown-item" role="menuitem">📅 Monthly Events</a>
            <a href="leaders.html" class="dropdown-item" role="menuitem">🌲 Meet the Leaders</a>
            <a href="races.html" class="dropdown-item" role="menuitem">🏃 Race Board</a>
            <a href="routes.html" class="dropdown-item" role="menuitem">🗺 Routes</a>
            <a href="recommended.html" class="dropdown-item" role="menuitem">⭐ Recommended</a>
            <a href="stats.html" class="dropdown-item" role="menuitem">📊 Club Stats</a>
            <a href="contact.html" class="dropdown-item" role="menuitem">✉️ Contact</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Explore dropdown toggle -->
  <script>
    (function() {
      const btn  = document.getElementById('explore-btn');
      const menu = document.getElementById('explore-menu');
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const isOpen = menu.classList.toggle('open');
        btn.classList.toggle('active', isOpen);
        btn.setAttribute('aria-expanded', isOpen);
      });
      document.addEventListener('click', function() {
        menu.classList.remove('open');
        btn.classList.remove('active');
        btn.setAttribute('aria-expanded', false);
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          menu.classList.remove('open');
          btn.classList.remove('active');
          btn.setAttribute('aria-expanded', false);
        }
      });
    })();
  </script>
  <!-- Leaflet Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-gpx/gpx.js"></script>
  <script src="script.js"></script>
</body>
</html>
