<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dirt Dorks Trail Club</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dark">

  <div id="intro">
    <img src="logo.png" alt="Dirt Dorks Trail Club" />
  </div>

  <div id="map"></div>

  <div class="trail-sign">
<div class="sign-title">Welcome To The Club</div>
<div class="sign-subtitle">Forest Park • Portland, OR</div>
</div>

  <footer>
  <a href="https://instagram.com/dirtdorks" 
     target="_blank" 
     class="instagram-btn">

    <!-- Instagram SVG Icon -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" 
         stroke-width="2" stroke-linecap="round" 
         stroke-linejoin="round">
      <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
      <circle cx="12" cy="12" r="4"></circle>
      <circle cx="18" cy="6" r="1"></circle>
    </svg>

    @dirtdorks
  </a>
</footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-gpx/gpx.js"></script>
  <script src="script.js"></script>
</body>

</html>
