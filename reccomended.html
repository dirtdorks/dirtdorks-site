<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recommended · Dirt Dorks Trail Club</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: #0a1a0f;
      overflow-x: hidden;
    }

    #map {
      position: fixed;
      inset: 0;
      z-index: 0;
      filter: saturate(1.1) brightness(0.88);
    }

    #vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(ellipse at center, transparent 20%, rgba(10,26,15,0.75) 100%),
        linear-gradient(to bottom, rgba(10,26,15,0.5) 0%, transparent 20%, transparent 80%, rgba(10,26,15,0.8) 100%);
      pointer-events: none;
    }

    .leaflet-control-attribution {
      background: rgba(0,0,0,0.5) !important;
      color: #bbb !important;
      font-size: 10px !important;
    }

    /* ── Page ── */
    #page {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      padding: 2rem 1.2rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .back {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #b6f2c2;
      margin-bottom: 2rem;
      padding: 0.38rem 0.85rem;
      background: rgba(15,40,20,0.75);
      border: 1px solid rgba(182,242,194,0.2);
      border-radius: 20px;
      backdrop-filter: blur(6px);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .back:hover { transform: translateY(-2px); filter: brightness(1.2); }

    /* ── Header ── */
    .page-header {
      text-align: center;
      margin-bottom: 2.8rem;
      animation: fadeUp 0.8s cubic-bezier(.16,1,.3,1) both;
    }

    .page-logo {
      width: clamp(80px, 10vw, 110px);
      height: auto;
      display: block;
      margin: 0 auto 0.8rem;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.65));
    }

    .page-header h1 {
      font-family: 'Montserrat Alternates', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      color: #e8f5e2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-shadow: 0 2px 20px rgba(0,0,0,0.6);
      line-height: 1.1;
    }

    .page-header .sub {
      font-size: 0.78rem;
      color: rgba(200,240,210,0.6);
      margin-top: 0.5rem;
      font-style: italic;
    }

    .header-rule {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #4cdc80, transparent);
      margin: 0.8rem auto 0;
    }

    /* ── Category sections ── */
    .categories {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 3rem;
    }

    .category {
      animation: fadeUp 0.8s cubic-bezier(.16,1,.3,1) both;
    }
    .category:nth-child(2) { animation-delay: 0.1s; }
    .category:nth-child(3) { animation-delay: 0.2s; }

    .category-header {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 1.1rem;
    }

    .category-icon { font-size: 1.2rem; }

    .category-title {
      font-family: 'Montserrat Alternates', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(182,242,194,0.7);
    }

    .category-rule {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(76,220,128,0.25), transparent);
    }

    /* ── Rec cards grid ── */
    .rec-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .rec-card {
      background: rgba(12,28,16,0.82);
      border: 1px solid rgba(182,242,194,0.1);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s ease, transform 0.18s ease, box-shadow 0.2s ease;
    }
    .rec-card:hover {
      border-color: rgba(76,220,128,0.3);
      transform: translateY(-3px);
      box-shadow: 0 10px 32px rgba(0,0,0,0.45);
    }

    /* Logo / image area */
    .rec-img {
      width: 100%;
      aspect-ratio: 16 / 7;
      object-fit: contain;
      object-position: center;
      background: rgba(255,255,255,0.04);
      padding: 1rem;
      display: block;
      border-bottom: 1px solid rgba(182,242,194,0.07);
    }

    /* Placeholder when no image */
    .rec-img-placeholder {
      width: 100%;
      aspect-ratio: 16 / 7;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(182,242,194,0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(182,242,194,0.2);
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .rec-body {
      padding: 0.9rem 1rem 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .rec-name {
      font-family: 'Montserrat Alternates', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      color: #d8f0de;
      letter-spacing: 0.02em;
    }

    .rec-desc {
      font-size: 0.72rem;
      line-height: 1.6;
      color: rgba(182,242,194,0.55);
      font-style: italic;
      flex: 1;
    }

    .rec-link {
      display: inline-flex;
      align-items: center;
      gap: 0.38rem;
      margin-top: 0.5rem;
      text-decoration: none;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #4cdc80;
      border: 1px solid rgba(76,220,128,0.3);
      border-radius: 20px;
      padding: 0.32rem 0.75rem;
      align-self: flex-start;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .rec-link:hover {
      background: rgba(76,220,128,0.12);
      color: #b6f2c2;
    }
    .rec-link svg { opacity: 0.7; flex-shrink: 0; }

    /* ── Disclaimer ── */
    .disclaimer {
      margin-top: 3rem;
      font-size: 0.65rem;
      color: rgba(182,242,194,0.28);
      text-align: center;
      font-style: italic;
      max-width: 480px;
      line-height: 1.6;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .rec-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 360px) {
      .rec-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <div id="vignette"></div>

  <div id="page">

    <a class="back" href="index.html">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back to Home
    </a>

    <div class="page-header">
      <img src="logo.png" alt="Dirt Dorks Trail Club" class="page-logo" />
      <h1>Recommended</h1>
      <p class="sub">Gear, fuel, and people we trust on the trails.</p>
      <div class="header-rule"></div>
    </div>

    <div class="categories" id="categories"></div>

    <p class="disclaimer">
      These are genuine recommendations from Dirt Dorks members. We are not sponsored by or affiliated with any of the brands listed.
    </p>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>

    // ─────────────────────────────────────────────────────────────
    // RECOMMENDATIONS
    // For each item:
    //   name:  brand or business name
    //   desc:  1-2 sentence description / why you recommend it
    //   url:   full link to their website
    //   img:   path to their logo image, e.g. 'logos/hoka.png' (or null)
    // ─────────────────────────────────────────────────────────────
    const DATA = [
      {
        category: 'Gear',
        icon: '🥾',
        items: [
          {
            name: 'Brand Name',
            desc: 'Add a description of why you recommend this brand — what makes it great for Forest Park trails.',
            url: 'https://example.com',
            img: null,
          },
          {
            name: 'Brand Name',
            desc: 'Add a description of why you recommend this brand — vest, poles, headlamp, whatever it is.',
            url: 'https://example.com',
            img: null,
          },
          {
            name: 'Brand Name',
            desc: 'Add a description here.',
            url: 'https://example.com',
            img: null,
          },
        ]
      },
      {
        category: 'Fuel & Hydration',
        icon: '⚡',
        items: [
          {
            name: 'Brand Name',
            desc: 'Add a description — gels, chews, real food, drink mix, whatever keeps your legs moving.',
            url: 'https://example.com',
            img: null,
          },
          {
            name: 'Brand Name',
            desc: 'Add a description here.',
            url: 'https://example.com',
            img: null,
          },
          {
            name: 'Wonder Honey Bun',
            desc: 'Jake\'s secret weapon on long runs. Carb-dense, pocket-friendly, and iconic.',
            url: 'https://example.com',
            img: null,
          },
        ]
      },
      {
        category: 'Physical Therapy & Recovery',
        icon: '🩺',
        items: [
          {
            name: 'Clinic Name',
            desc: 'Add a description — who they are, what they specialize in, why trail runners trust them.',
            url: 'https://example.com',
            img: null,
          },
          {
            name: 'Clinic Name',
            desc: 'Add a description here.',
            url: 'https://example.com',
            img: null,
          },
          {
            name: 'Clinic Name',
            desc: 'Add a description here.',
            url: 'https://example.com',
            img: null,
          },
        ]
      },
    ];

    // ── Render ──
    const container = document.getElementById('categories');

    DATA.forEach((cat, ci) => {
      const section = document.createElement('div');
      section.className = 'category';
      section.style.animationDelay = `${0.1 * ci}s`;

      const grid = cat.items.map((item, ii) => {
        const imgHTML = item.img
          ? `<img class="rec-img" src="${item.img}" alt="${item.name}" />`
          : `<div class="rec-img-placeholder">Add logo</div>`;

        return `
          <div class="rec-card" style="animation-delay:${0.06*ii}s">
            ${imgHTML}
            <div class="rec-body">
              <div class="rec-name">${item.name}</div>
              <div class="rec-desc">${item.desc}</div>
              <a class="rec-link" href="${item.url}" target="_blank" rel="noopener noreferrer">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                  <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                </svg>
                Visit Site
              </a>
            </div>
          </div>`;
      }).join('');

      section.innerHTML = `
        <div class="category-header">
          <span class="category-icon">${cat.icon}</span>
          <span class="category-title">${cat.category}</span>
          <div class="category-rule"></div>
        </div>
        <div class="rec-grid">${grid}</div>`;

      container.appendChild(section);
    });

    // ── Map background ──
    const map = L.map('map', {
      zoomControl: false, minZoom: 14, maxZoom: 14,
      scrollWheelZoom: false, dragging: false,
      keyboard: false, touchZoom: false, doubleClickZoom: false,
    }).setView([45.5725, -122.7726], 14);

    L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://www.opentopomap.org">OpenTopoMap</a> | © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 16, subdomains: ['a', 'b', 'c'], opacity: 0.55,
    }).addTo(map);

    L.rectangle(
      L.latLngBounds([44.0, -124.5], [46.5, -121.0]),
      { color: 'transparent', fillColor: '#0a1a0f', fillOpacity: 0.65, interactive: false }
    ).addTo(map);

  </script>
</body>
</html>
